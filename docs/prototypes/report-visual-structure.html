<!doctype html>
<!--
PROTOTYPE, throwaway. Not the report template.

Question: what should Layer 1 of the presence report look like so it reads as a professional,
brand-true document with a clear order of importance, instead of a generated dashboard?

Three variants of Layer 1, switchable via ?variant=a|b|c and the floating bar at the bottom.
Every variant renders from the same data: the 4 September 2026 scan of pinmeto.com
(docs/test-runs/2026-09-04-report-scan1.html). Layer 2 is stubbed behind its expander; the
Theme brief drawer is stubbed to its header. Nothing here is wired to a real report.

  a  Briefing document   one column, white page, no cards, typographic hierarchy, hairlines
  b  Navy rail           sticky navy rail (score, pillars, contents) beside a work table
  c  Three tiers         importance made explicit: start here / then / when those are done
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: report visual structure, pinmeto.com</title>
<style>
:root{--navy:#000050;--blue:#3399FF;--link:#1E7FE0;--orange:#FF8854;--lblue:#BBD9FA;--lgrey:#F2F3F4;
--grey:#333333;--muted:#6A6F76;--line:#E2E6EA;--wash:#EAF4FF;--fail:#B5481E;--pass:#137A50;
--dotfail:#FF8854;--dotpass:#1FA971;--dotwarn:#6A6F76}
*{box-sizing:border-box}
html{font-family:Montserrat,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;color:var(--grey);-webkit-font-smoothing:antialiased}
body{margin:0;background:#fff}
h1,h2,h3,h4{color:var(--navy);margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
a{color:var(--link)}
button{font:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{display:inline-block;background:#fff;color:var(--link);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:13.5px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:#000040}
.btn.link{border:0;padding:0;background:none;text-decoration:underline;text-underline-offset:3px}
.btn.link:hover{background:none;color:var(--navy)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:7px}
.d-fail{background:var(--dotfail)}.d-warn{background:var(--dotwarn)}.d-pass{background:var(--dotpass)}
.rank{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--orange);color:var(--navy);font-weight:800;font-size:15px;align-items:center;justify-content:center;flex:0 0 auto}
.band-fail{color:var(--fail)}.band-pass{color:var(--pass)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:600;color:var(--navy)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}

/* ---------- drawer stub ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,60,.34);z-index:55;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:#fff;border-left:1px solid var(--line);
box-shadow:-8px 0 30px rgba(0,0,80,.16);padding:28px;overflow-y:auto;z-index:60;display:none}
.drawer.open{display:block}
.drawer h3{font-size:22px;margin:14px 0 8px}
.drawer .meta{font-size:13px;color:var(--muted);margin:0 0 14px}
.drawer .stub{background:var(--lgrey);border-radius:8px;padding:16px;font-size:13.5px;color:var(--muted);margin-top:22px}

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:4px;
background:#333;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.28);font-size:13px}
.proto-bar button{background:none;border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.proto-bar button:hover{background:rgba(255,255,255,.14)}
.proto-bar .lbl{padding:0 10px;white-space:nowrap}
.proto-bar .lbl b{color:var(--orange);margin-right:6px;font-weight:700}
@media print{.proto-bar,.drawer,.scrim{display:none !important}}

/* =====================================================================
   A. Briefing document
   ===================================================================== */
.va{background:#fff;min-height:100vh}
.va .page{max-width:880px;margin:0 auto;padding:40px 32px 96px}
.va .mast{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.va .mast svg{height:30px;width:auto;display:block}
.va .mast .doc{font-size:13px;font-weight:600;color:var(--navy)}
.va .title{padding:48px 0 40px}
.va .title h1{font-size:46px;font-weight:700;letter-spacing:-.025em}
.va .title p{margin-top:12px;font-size:15px;color:var(--muted)}
.va .verdict{display:grid;grid-template-columns:200px 1fr;gap:44px;padding:40px 0;border-top:1px solid var(--line)}
.va .score .n{font-size:96px;font-weight:800;line-height:.88;letter-spacing:-.035em;color:var(--navy)}
.va .score .of{font-size:13px;color:var(--muted);margin-top:10px}
.va .score .band{font-size:15px;font-weight:700;margin-top:2px}
.va .verdict .prose p{font-size:17px;line-height:1.6;max-width:62ch}
.va .verdict .prose p+p{margin-top:16px}
.va .counts{margin-top:22px;font-size:13.5px;color:var(--muted);display:flex;gap:22px;flex-wrap:wrap}
.va .counts b{color:var(--grey);font-weight:600}
.va .pillars{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0}
.va .pillars>div+div{border-left:1px solid var(--line);padding-left:24px}
.va .pillars .nm{font-size:13px;font-weight:600;color:var(--navy)}
.va .pillars .v{font-size:36px;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.1;margin:6px 0 2px}
.va .pillars .bw{font-size:13px;font-weight:600}
.va h2{font-size:28px;letter-spacing:-.02em;margin:64px 0 6px}
.va .lede{color:var(--muted);font-size:15px;max-width:62ch;margin-bottom:22px}
.va .row{display:grid;grid-template-columns:56px 1fr 160px;gap:24px;padding:26px 0;border-top:1px solid var(--line)}
.va .row:last-child{border-bottom:1px solid var(--line)}
.va .row .rk{font-size:26px;font-weight:600;color:var(--muted);line-height:30px}
.va .row h3{font-size:20px;letter-spacing:-.015em}
.va .row .sum{margin-top:8px;max-width:60ch}
.va .row .meta{margin-top:10px;font-size:13px;color:var(--muted)}
.va .row .side{text-align:right}
.va .row .side .w{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.va .row .side .wl{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.va .nap{display:grid;grid-template-columns:56px 1fr 160px;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}
.va .nap h3{font-size:20px}
.va .nap .w{font-size:26px;font-weight:700;color:var(--fail);text-align:right;letter-spacing:-.02em;line-height:1.1}
.va .nap .wl{font-size:12.5px;color:var(--muted);text-align:right}
.va details{border-bottom:1px solid var(--line);margin-top:40px}
.va details summary{padding:22px 0;font-size:17px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.va details summary span{font-size:13px;font-weight:600;color:var(--link)}
.va details .body{padding:0 0 26px;color:var(--muted);font-size:14px}
.va .next{background:var(--lgrey);border-radius:10px;padding:32px 36px;margin-top:64px}
.va .next h2{margin:0 0 14px;font-size:24px}
.va .next ol{margin:0;padding-left:22px}
.va .next li{margin:0 0 10px;max-width:70ch}
.va .prompt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.va .prompt code{font-family:inherit;font-size:14px;color:var(--navy)}
.va .method{margin-top:64px}
.va .method h2{font-size:24px;margin:0 0 16px}
.va .method table{margin-bottom:22px}
.va .method p{font-size:14px;color:var(--grey);margin-top:12px;max-width:72ch}
.va .method p b{color:var(--navy)}
.va footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
@media (max-width:700px){
  .va .verdict,.va .row,.va .nap{grid-template-columns:1fr;gap:14px}
  .va .row .side,.va .nap .w,.va .nap .wl{text-align:left}
  .va .pillars{grid-template-columns:1fr 1fr;gap:18px}
  .va .pillars>div+div{border-left:0;padding-left:0}
  .va .title h1{font-size:36px}.va .score .n{font-size:72px}
}

/* =====================================================================
   B. Navy rail
   ===================================================================== */
.vb{background:var(--lgrey);min-height:100vh;display:grid;grid-template-columns:296px minmax(0,1fr)}
.vb .rail{background:var(--navy);color:#fff;padding:30px 28px 28px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:30px}
.vb .rail svg{height:22px;width:auto;display:block}
.vb .rail .doc{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:26px}
.vb .rail h1{color:#fff;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.vb .rail .date{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:6px}
.vb .rail .score .n{font-size:76px;font-weight:800;line-height:.9;letter-spacing:-.03em;color:#fff}
.vb .rail .score .of{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:8px}
.vb .rail .tag{display:inline-block;background:var(--lblue);color:var(--navy);font-size:12.5px;font-weight:700;border-radius:4px;padding:4px 10px;margin-top:10px}
.vb .rail .pl{display:flex;flex-direction:column;gap:12px}
.vb .rail .pl .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.vb .rail .pl .r .v{font-weight:700}
.vb .rail .pl .bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.vb .rail .pl .bar i{display:block;height:100%;background:var(--lblue)}
.vb .rail .pl .bw{grid-column:1/-1;font-size:11.5px;color:rgba(255,255,255,.72);margin-top:-2px}
.vb .rail nav{border-top:1px solid rgba(255,255,255,.16);padding-top:14px}
.vb .rail nav a{display:block;color:#fff;text-decoration:none;font-size:13.5px;padding:7px 0}
.vb .rail nav a:hover{color:var(--lblue)}
.vb .rail .foot{font-size:11.5px;color:rgba(255,255,255,.6)}
.vb .main{padding:44px 48px 96px;max-width:980px;min-width:0}
.vb section{margin-bottom:44px}
.vb .main h2{font-size:22px;letter-spacing:-.015em;margin-bottom:6px}
.vb .lede{color:var(--muted);font-size:14px;margin-bottom:16px;max-width:70ch}
.vb .panel{background:#fff;border-radius:10px;padding:28px 30px}
.vb .panel p{font-size:16px;line-height:1.6;max-width:70ch}
.vb .panel p+p{margin-top:14px}
.vb .counts{margin-top:20px;font-size:13.5px;color:var(--muted);display:flex;gap:22px;flex-wrap:wrap}
.vb .counts b{color:var(--grey);font-weight:600}
.vb .work{background:#fff;border-radius:10px;overflow:hidden}
.vb .work th{padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.vb .work td{padding:18px 16px;border-bottom:1px solid var(--line)}
.vb .work tr:last-child td{border-bottom:0}
.vb .work .c-rank{width:54px;text-align:center}
.vb .work .c-rank span{font-size:17px;font-weight:600;color:var(--muted)}
.vb .work h3{font-size:16.5px;letter-spacing:-.01em}
.vb .work .sum{font-size:13.5px;margin-top:6px;max-width:52ch;color:var(--grey)}
.vb .work .c-worth{width:170px}
.vb .work .c-worth .w{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.vb .work .c-worth .bar{height:6px;background:var(--lgrey);border-radius:3px;margin-top:8px;overflow:hidden}
.vb .work .c-worth .bar i{display:block;height:100%;background:var(--navy);border-radius:3px}
.vb .work .c-eff{width:150px;font-size:13px;color:var(--grey)}
.vb .work .c-eff small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.vb .work .c-fix{width:96px;text-align:right;white-space:nowrap}
.vb .napgrid{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.vb .napgrid .w{font-size:44px;font-weight:800;color:var(--fail);letter-spacing:-.03em;line-height:1}
.vb .napgrid .wl{font-size:12.5px;color:var(--muted);margin-top:4px}
.vb .napgrid p{font-size:15px}
.vb details.panel{padding:0}
.vb details summary{padding:22px 30px;font-size:16px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.vb details summary span{font-size:13px;font-weight:600;color:var(--link)}
.vb details .body{padding:0 30px 26px;color:var(--muted);font-size:14px}
.vb .next ol{margin:0;padding-left:22px;font-size:15px}
.vb .next li{margin:0 0 10px;max-width:70ch}
.vb .prompt{background:var(--lgrey);border-radius:8px;padding:14px 16px;margin-top:18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.vb .prompt code{font-family:inherit;font-size:14px;color:var(--navy)}
.vb .method p{font-size:14px;margin-top:12px;max-width:72ch}
.vb .method p b{color:var(--navy)}
.vb .method table{margin-bottom:8px}
.vb footer{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){
  .vb{grid-template-columns:1fr}
  .vb .rail{position:static;height:auto}
  .vb .rail nav{margin-top:0}
  .vb .main{padding:28px 20px 96px}
  .vb .work .c-eff,.vb .work th:nth-child(4){display:none}
}

/* =====================================================================
   C. Three tiers
   ===================================================================== */
.vc{background:var(--lgrey);min-height:100vh}
.vc .top{background:#fff;border-bottom:1px solid var(--line)}
.vc .top .in{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.vc .top svg{height:24px;width:auto;display:block}
.vc .top .doc{font-size:13.5px;font-weight:600;color:var(--navy);text-align:right}
.vc .top .doc small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.vc .page{max-width:1080px;margin:0 auto;padding:36px 24px 96px}
.vc .panel{background:#fff;border-radius:12px;padding:30px 32px}
.vc .board{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start}
.vc .board .n{font-size:84px;font-weight:800;line-height:.88;letter-spacing:-.035em;color:var(--navy)}
.vc .board .of{font-size:13px;color:var(--muted);margin-top:10px}
.vc .board .tag{display:inline-block;background:var(--lblue);color:var(--navy);font-size:13px;font-weight:700;border-radius:4px;padding:4px 10px;margin-top:10px}
.vc .board h1{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:0}
.vc .board h1 b{color:var(--navy);font-weight:700}
.vc .board p{font-size:16px;line-height:1.6;max-width:68ch}
.vc .board p+p{margin-top:12px}
.vc .board .counts{margin-top:16px;font-size:13.5px;color:var(--muted);display:flex;gap:22px;flex-wrap:wrap}
.vc .board .counts b{color:var(--grey);font-weight:600}
.vc .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.vc .pillars .nm{font-size:13px;font-weight:600;color:var(--navy)}
.vc .pillars .v{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.1;margin:4px 0 8px}
.vc .pillars .bar{height:6px;background:var(--lgrey);border-radius:3px;overflow:hidden}
.vc .pillars .bar i{display:block;height:100%;background:var(--navy);border-radius:3px}
.vc .pillars .bw{font-size:12.5px;font-weight:600;margin-top:8px}
.vc .tier{margin-top:44px}
.vc .tier .hd{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.vc .tier h2{font-size:22px;letter-spacing:-.015em}
.vc .tier .hd p{font-size:14px;color:var(--muted)}
.vc .feature{display:grid;grid-template-columns:1fr 250px;gap:36px}
.vc .feature .head{display:flex;gap:14px;align-items:flex-start}
.vc .feature h3{font-size:28px;letter-spacing:-.02em;line-height:1.15}
.vc .feature .sum{font-size:17px;line-height:1.6;margin-top:16px;max-width:64ch}
.vc .facts{display:flex;gap:32px;margin-top:22px;flex-wrap:wrap}
.vc .facts div{font-size:14px;color:var(--grey)}
.vc .facts small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.vc .worth{background:var(--lblue);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:6px;align-self:stretch}
.vc .worth .w{font-size:56px;font-weight:800;color:var(--navy);letter-spacing:-.035em;line-height:.95}
.vc .worth .wl{font-size:13px;color:var(--navy);margin-bottom:14px}
.vc .worth .btn{margin-top:auto;text-align:center}
.vc .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vc .two .panel{display:flex;flex-direction:column}
.vc .two .head{display:flex;gap:12px;align-items:flex-start}
.vc .two h3{font-size:20px;letter-spacing:-.015em}
.vc .two .sum{font-size:15px;margin-top:12px}
.vc .two .facts{margin-top:18px}
.vc .two .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:20px}
.vc .two .foot .w{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.vc .two .foot .w small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.vc .list{padding:8px 32px}
.vc .list .r{display:grid;grid-template-columns:1fr 130px 200px 100px;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.vc .list .r:last-child{border-bottom:0}
.vc .list h3{font-size:15.5px;font-weight:600;letter-spacing:0}
.vc .list .eff{font-size:12.5px;color:var(--muted);margin-top:3px}
.vc .list .w{font-size:15px;font-weight:700;color:var(--navy)}
.vc .list .pil{font-size:13px;color:var(--grey)}
.vc .list .fix{text-align:right}
.vc .nap{margin-top:24px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center}
.vc .nap .w{font-size:40px;font-weight:800;color:var(--fail);letter-spacing:-.03em;line-height:1}
.vc .nap .wl{font-size:12.5px;color:var(--muted);margin-top:4px}
.vc .nap h3{font-size:16px;margin-bottom:4px}
.vc .nap p{font-size:14px}
.vc details.panel{padding:0;margin-top:24px}
.vc details summary{padding:22px 32px;font-size:16px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.vc details summary span{font-size:13px;font-weight:600;color:var(--link)}
.vc details .body{padding:0 32px 26px;color:var(--muted);font-size:14px}
.vc .next{background:var(--navy);color:#fff;margin-top:44px}
.vc .next h2{color:#fff;font-size:24px;margin-bottom:14px}
.vc .next ol{margin:0;padding-left:22px}
.vc .next li{margin:0 0 10px;max-width:70ch;color:rgba(255,255,255,.9)}
.vc .next b{color:#fff}
.vc .prompt{background:rgba(255,255,255,.08);border-radius:8px;padding:14px 16px;margin-top:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.vc .prompt code{font-family:inherit;font-size:14px;color:#fff}
.vc .next .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.vc .next .btn:hover{background:rgba(255,255,255,.1)}
.vc .method{margin-top:24px}
.vc .method h2{font-size:22px;margin-bottom:14px}
.vc .method p{font-size:14px;margin-top:12px;max-width:72ch}
.vc .method p b{color:var(--navy)}
.vc .method table{margin-bottom:8px}
.vc footer{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:820px){
  .vc .board,.vc .feature,.vc .two{grid-template-columns:1fr;gap:20px}
  .vc .pillars{grid-template-columns:1fr 1fr}
  .vc .list .r{grid-template-columns:1fr auto;gap:10px}

/* ------------------------------------------------------------------ helpers */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const bandClass = b => (b === 'Strong' || b === 'Healthy') ? 'band-pass' : 'band-fail';
const pts = n => `${n} ${n === 1 ? 'point' : 'points'}`;
const words = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const totalWorth = D.themes.reduce((a, t) => a + t.worth, 0);
const maxWorth = Math.max(...D.themes.map(t => t.worth));
const missing = 100 - D.overall;
const list = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const paysIn = t => `pays in ${list(t.pillars)}`;
const checksWord = n => `${words[n] ? cap(words[n]) : n} ${n === 1 ? 'check' : 'checks'}`;
const metaSentence = t => `${checksWord(t.checks)}. ${t.effort}. One fix, ${paysIn(t)}.`;
const countsRow = () => `
  <span><i class="dot d-fail"></i><b class="num">${D.counts.fail}</b> failing checks</span>
  <span><i class="dot d-warn"></i><b class="num">${D.counts.warn}</b> could not be measured</span>
  <span><i class="dot d-pass"></i><b class="num">${D.counts.pass}</b> passing</span>`;
const methodTable = () => `
  <table><thead><tr><th>Pillar</th><th>Weight</th><th>What it covers</th></tr></thead><tbody>
  ${D.pillars.map(p => `<tr><td><b>${p.name}</b></td><td class="num">${p.weight}%</td><td>${esc(p.blurb)}</td></tr>`).join('')}
  </tbody></table>
  <p>Rubric ${D.rubric}, scanned ${D.date}. Sources: Google, Apple and Bing Maps as observed in a browser, your website and store locator, PageSpeed Insights, and PinMeTo location data.</p>
  ${D.method.map(m => `<p>${m}</p>`).join('')}`;
const layer2Stub = (cls) => `
  <details class="${cls}" id="layer2">
    <summary>Full audit detail: every check, every location, the NAP matrix <span>Open</span></summary>
    <div class="body">Layer 2 is unchanged in this prototype: scan-history table, section nav and filter, ${D.pillars.length} pillar sections with ${D.counts.fail + D.counts.warn + D.counts.pass} check rows, the location breakdown, the NAP consistency matrix and the listing content table render here exactly as the current report does.</div>
  </details>`;
const fixBtn = (t, cls = 'btn') => `<button type="button" class="${cls}" data-brief="${t.slug}">How to fix</button>`;

        </div>
        <div class="pillars" style="grid-column:1/-1">
          ${D.pillars.map(p => `<div><div class="nm">${p.name}</div><div class="v num">${p.score}</div><div class="bar"><i style="width:${p.score}%"></i></div><div class="bw ${bandClass(p.band)}">${p.band}</div></div>`).join('')}
        </div>
      </section>

      <section class="tier" id="themes">
        <div class="hd"><h2>Start here</h2><p>The one fix that returns the most of the ${missing} points you are missing.</p></div>
        <div class="panel feature" id="theme-${t1.slug}">
          <div>
            <div class="head"><span class="rank">1</span><h3>${esc(t1.name)}</h3></div>
            <p class="sum">${esc(t1.summary)}</p>
            ${facts(t1)}
          </div>
          <div class="worth">
            <div class="w num">~${t1.worth}</div>
            <div class="wl">${t1.worth === 1 ? 'point' : 'points'} back, ${t1.pass[0]} of ${t1.pass[1]} checks already pass</div>
            ${fixBtn(t1, 'btn primary')}
          </div>
        </div>
      </section>

      <section class="tier">
        <div class="hd"><h2>Then</h2><p>Both are template changes, so they ship together with the first.</p></div>
        <div class="two">
          ${[t2, t3].map((t, i) => `<div class="panel" id="theme-${t.slug}">
            <div class="head"><span class="rank">${i + 2}</span><h3>${esc(t.name)}</h3></div>
            <p class="sum">${esc(t.summary)}</p>
            ${facts(t)}
            <div class="foot"><span class="w num">~${t.worth}<small>${t.worth === 1 ? 'point' : 'points'} back</small></span>${fixBtn(t)}</div>
          </div>`).join('')}
        </div>
      </section>

      <section class="tier">
        <div class="hd"><h2>When those are done</h2><p>${cap(words[rest.length])} smaller themes, about ${pts(restWorth)} together.</p></div>
        <div class="panel list">
          ${rest.map((t, i) => `<div class="r" id="theme-${t.slug}">
            <div><h3>${esc(t.name)}</h3><div class="eff">${esc(t.effort)}</div></div>
            <div class="w num">~${pts(t.worth)}</div>
            <div class="pil">${checksWord(t.checks)}, ${paysIn(t)}</div>
            <div class="fix">${fixBtn(t, 'btn link')}</div>
          </div>`).join('')}
        </div>
      </section>

      <section class="panel nap" id="nap">
        <div><div class="w num">${D.nap.mismatches}</div><div class="wl">mismatches</div></div>
        <div><h3>Name, address and phone across ${D.nap.locations} locations</h3><p>${esc(D.nap.sharpest)}</p></div>
        <a class="btn" href="#layer2" data-l2link="1">See the full matrix</a>
      </section>

      ${layer2Stub('panel')}

      <section class="panel next" id="next">
        <h2>Ship the fixes, then scan again</h2>
        <ol>${D.next.map(s => `<li>${s}</li>`).join('')}</ol>
        <div class="prompt"><code>${esc(D.rerun)}</code><button type="button" class="btn" data-copy="rerun">Copy</button></div>
      </section>

      <section class="panel method" id="method">
        <h2>How this was scored</h2>
        ${methodTable()}
      </section>
      <footer>Generated by the PinMeTo web presence skill. Rubric ${D.rubric}</footer>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ switcher + stubs */
const VARIANTS = [
  { key: 'a', name: 'Briefing document', render: variantA },
  { key: 'b', name: 'Navy rail', render: variantB },
  { key: 'c', name: 'Three tiers', render: variantC }
];
function current() {
  const k = new URLSearchParams(location.search).get('variant');
  return Math.max(0, VARIANTS.findIndex(v => v.key === k));
}
function render() {
  const i = current(), v = VARIANTS[i];
  document.body.dataset.variant = v.key;
  document.getElementById('root').innerHTML = v.render();
  document.getElementById('proto-label').innerHTML = `<b>Prototype</b>${v.key.toUpperCase()}: ${v.name}`;
  document.title = `PROTOTYPE ${v.key.toUpperCase()}: ${v.name}, ${D.domain}`;
}
function cycle(dir) {
  const i = (current() + dir + VARIANTS.length) % VARIANTS.length;
  const u = new URL(location.href); u.searchParams.set('variant', VARIANTS[i].key);
  history.replaceState(null, '', u); render(); window.scrollTo(0, 0);
}
document.querySelectorAll('[data-cycle]').forEach(b => b.addEventListener('click', () => cycle(+b.dataset.cycle)));
document.addEventListener('keydown', e => {
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.key === 'Escape') closeDrawer();
});

const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function openBrief(slug) {
  const t = D.themes.find(x => x.slug === slug);
  const briefs = t.checks;
  drawer.innerHTML = `
    <button type="button" class="btn" data-close="1" style="float:right">Close</button>
    <h3>${esc(t.name)}</h3>
    <p class="meta">Worth about ${pts(t.worth)}. ${esc(t.effort)}. ${t.pass[0]} of ${t.pass[1]} checks already pass.</p>
    <p>${esc(t.description)}</p>
    <p style="margin-top:16px">${fixBtn(t, 'btn').replace('How to fix', `Copy all ${briefs} ${briefs === 1 ? 'brief' : 'briefs'}`).replace(`data-brief="${t.slug}"`, 'data-copy="briefs"')}</p>
    <div class="stub">Prototype stub. The Theme brief below this header is the per-check fix briefs exactly as the current report renders them (${briefs} ${briefs === 1 ? 'section' : 'sections'} here); nothing in it changes with the Layer 1 restyle.</div>`;
  drawer.classList.add('open'); scrim.classList.add('open');
}
function closeDrawer() { drawer.classList.remove('open'); scrim.classList.remove('open'); }
scrim.addEventListener('click', closeDrawer);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-brief]'); if (b) { openBrief(b.dataset.brief); return; }
  if (e.target.closest('[data-close]')) { closeDrawer(); return; }
  const c = e.target.closest('[data-copy]');
  if (c) { const txt = c.dataset.copy === 'rerun' ? D.rerun : '(briefs)'; navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); const o = c.textContent; c.textContent = 'Copied'; setTimeout(() => c.textContent = o, 1200); return; }
  const l = e.target.closest('[data-l2link]');
  if (l) { const d = document.getElementById('layer2'); if (d) d.open = true; }
});
render();
</script>
</body></html>
