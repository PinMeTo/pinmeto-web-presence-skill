<!doctype html>
<!--
PROTOTYPE, throwaway. Not the report template. Round 2.

Question: how does Layer 1 make it unmistakable what to do first, and tell the progress story
when the report has run more than once, while staying a brand-true, professional document?

Round 1 (report-visual-structure.html): A (briefing document) and C (three tiers) were the
keepers, B was rejected, and all three were judged too generic with no clear focus.

Three new variants, switchable via ?variant=d|e|f, each rendered against three scan states via
?scan=1|2|3 (first scan, real re-run, illustrative third scan). Bottom bar switches both.

  d  Lead with the action   editorial page; the headline is the first Theme, a "missing points"
                            bar shows where the gap is, one Theme expanded, the rest one line each
  e  Route to 100           the brand's A-to-B journey line as the hero: first scan to 100, cleared
                            Themes as passed stops, the next stop in orange
  f  One focus card         the first screen is one card: where you stand on the left, the one thing
                            to do on the right; everything else follows in muted density

Data: scans 1 and 2 are the real 4 September 2026 scans of pinmeto.com (docs/test-runs/).
Scan 3 is ILLUSTRATIVE: a hypothetical 12 October 2026 re-run after the template change shipped,
written to exercise cleared Themes and a large movement. Nothing here is a real report.
-->

/* ------------------------------------------------------------------ helpers */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const bandClass = b => (b === 'Strong' || b === 'Healthy') ? 'band-pass' : 'band-fail';
const pts = n => `${n} ${n === 1 ? 'point' : 'points'}`;
const words = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const list = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const checksWord = n => `${words[n] ? cap(words[n]) : n} ${n === 1 ? 'check' : 'checks'}`;
const sign = d => d > 0 ? `+${d}` : d < 0 ? `−${Math.abs(d)}` : '0';

function view(scanIndex) {
  const s = SCANS[scanIndex], first = SCANS[0], prev = scanIndex > 0 ? SCANS[scanIndex - 1] : null;
  const themes = s.themes.map((t, i) => ({ ...t, ...MAP[t.slug], rank: i + 1 }));
  const total = themes.reduce((a, t) => a + t.worth, 0);
  const missing = 100 - s.overall;
  const openSince = scanIndex > 0 ? `Open since ${first.date}, ${words[scanIndex + 1]} scans` : null;
  const trend = prev ? {
    sinceFirst: s.overall - first.overall,
    sincePrev: s.overall - prev.overall,
    headline: s.overall === first.overall ? `Unchanged since your first scan on ${first.date}`
      : `${s.overall > first.overall ? 'Up' : 'Down'} ${pts(Math.abs(s.overall - first.overall))} since your first scan on ${first.date}`,
    subline: scanIndex >= 2 ? (s.overall === prev.overall ? `No change since ${prev.date}` : `${sign(s.overall - prev.overall)} since ${prev.date}`) : null,
    pillarDeltas: PILLARS.map(p => ({ ...p, score: s.pillars[p.key], delta: s.pillars[p.key] - prev.pillars[p.key] })),
    cleared: s.cleared.map(slug => MAP[slug].name),
    clearedLine: s.cleared.length ? `${cap(words[s.cleared.length])} ${s.cleared.length === 1 ? 'theme' : 'themes'} cleared since your first scan on ${first.date}: ${s.cleared.map(x => MAP[x].name).join(', ')}` : null,
    moved: s.moved, prevDate: prev.date
  } : null;
  return { s, first, prev, themes, total, missing, openSince, trend, band: band(s.overall),
    pillars: PILLARS.map(p => ({ ...p, score: s.pillars[p.key], band: band(s.pillars[p.key]), delta: prev ? s.pillars[p.key] - prev.pillars[p.key] : null })),
    history: SCANS.slice(0, scanIndex + 1) };
}

const countsRow = v => `
  <span><i class="dot d-fail"></i><b class="num">${v.s.counts.fail}</b> failing checks</span>
  <span><i class="dot d-warn"></i><b class="num">${v.s.counts.warn}</b> could not be measured</span>
  <span><i class="dot d-pass"></i><b class="num">${v.s.counts.pass}</b> passing</span>`;
const methodBlock = v => `
  <table><thead><tr><th>Pillar</th><th>Weight</th><th>What it covers</th></tr></thead><tbody>
  ${PILLARS.map(p => `<tr><td><b>${p.name}</b></td><td class="num">${p.weight}%</td><td>${esc(p.blurb)}</td></tr>`).join('')}
  </tbody></table>
  <p>Rubric ${BRAND.rubric}, scanned ${v.s.date}. Sources: Google, Apple and Bing Maps as observed in a browser, your website and store locator, PageSpeed Insights, and PinMeTo location data.</p>
  ${v.s.method.map(m => `<p>${m}</p>`).join('')}`;
const layer2Stub = (v, cls) => `
  <details class="${cls}" id="layer2">
    <summary>Full audit detail: every check, every location, the NAP matrix <span>Open</span></summary>
    <div class="body">Layer 2 is unchanged in this prototype: ${v.history.length > 1 ? 'the scan-history table, ' : ''}section nav and filter, four pillar sections with ${v.s.counts.fail + v.s.counts.warn + v.s.counts.pass} check rows, the location breakdown, the NAP consistency matrix and the listing content table render here exactly as the current report does.</div>
  </details>`;
const fixBtn = (t, cls = 'btn') => `<button type="button" class="${cls}" data-brief="${t.slug}">How to fix</button>`;
const deltaPill = (d, since) => d === null ? '' : `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}">${d > 0 ? '↑ ' : d < 0 ? '↓ ' : ''}${d === 0 ? 'No change' : sign(d) + ' ' + (Math.abs(d) === 1 ? 'point' : 'points')}</span>`;
const nextSteps = v => v.s.next || SCANS[0].next;
const rerun = v => `Re-run the presence scan for ${BRAND.domain} and show me what changed since ${v.s.date}.`;
const facts = t => `<div class="facts">
  <div><small>Failing checks</small>${t.checks}</div>
  <div><small>Effort</small>${esc(t.effort)}</div>
  <div><small>Pays in</small>${list(t.pillars)}</div>
  <div><small>Already passing</small>${t.pass} of ${t.k} checks</div></div>`;

/* small line chart of overall score across scans */
function chart(v, w = 260, h = 96, dark = false) {
  const hist = v.history, n = hist.length;
  const padL = 10, padR = 14, padT = 16, padB = 22, W = w - padL - padR, H = h - padT - padB;
  const x = i => padL + (n === 1 ? W / 2 : i * W / (n - 1));
  const y = s => padT + H - (s / 100) * H;
  const line = dark ? 'rgba(255,255,255,.25)' : '#E2E6EA', txt = dark ? 'rgba(255,255,255,.72)' : '#6A6F76', ink = dark ? '#fff' : '#000050';
  const grid = [0, 50, 100].map(g => `<line x1="${padL}" x2="${w - padR}" y1="${y(g)}" y2="${y(g)}" stroke="${line}" stroke-width="1"/>`).join('');
  const path = hist.map((s, i) => `${i ? 'L' : 'M'}${x(i)},${y(s.overall)}`).join(' ');
  const dots = hist.map((s, i) => {
    const last = i === n - 1;

  }).join('');

/* ------------------------------------------------------------------ E. Route to 100 */
function routeSvg(v) {
  const W = 1000, H = 150, padL = 40, padR = 40, y = 78;
  const start = v.first.overall, span = 100 - start;
  const X = s => padL + (s - start) / span * (W - padL - padR);
  const out = [];
  // dotted track, whole route
  out.push(`<line x1="${X(start)}" x2="${X(100)}" y1="${y}" y2="${y}" stroke="#BBD9FA" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>`);
  // travelled part
  if (v.s.overall > start) out.push(`<line x1="${X(start)}" x2="${X(v.s.overall)}" y1="${y}" y2="${y}" stroke="#000050" stroke-width="4" stroke-linecap="round"/>`);
  // ahead segments (themes)
  let pos = v.s.overall;
  v.themes.forEach((t, i) => {
    const a = X(pos), b = X(pos + t.worth);
    if (i === 0) out.push(`<line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="#FF8854" stroke-width="8" stroke-linecap="round"/>`);
    else out.push(`<line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="#000050" stroke-width="2"/>`);
    pos += t.worth;
    const nextW = i + 1 < v.themes.length ? X(pos + v.themes[i + 1].worth) - b : Infinity;
    if (i === 0 || (b - a >= 40 && nextW >= 40)) out.push(`<circle cx="${b}" cy="${y}" r="11" fill="#fff" stroke="${i === 0 ? '#FF8854' : '#000050'}" stroke-width="2"/>
      <text x="${b}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#000050">${t.rank}</text>`);
    else out.push(`<circle cx="${b}" cy="${y}" r="4.5" fill="#fff" stroke="#000050" stroke-width="2"/>`);
  });
  // cleared stops on the travelled part, spread evenly between first and now
  const cl = v.s.cleared || [];
  cl.forEach((slug, i) => {
    const cx = X(start + (v.s.overall - start) * (i + 1) / (cl.length + 1));
    out.push(`<circle cx="${cx}" cy="${y}" r="11" fill="#1FA971"/><path d="M${cx - 5},${y} l3.5,3.5 l6.5,-7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  });
  // start marker + label
  const close = X(v.s.overall) - X(start) < 90;
  out.push(`<circle cx="${X(start)}" cy="${y}" r="5" fill="#000050"/>
    <text x="${X(start)}" y="${y + 36}" text-anchor="middle" font-size="12" fill="#6A6F76">${v.history.length > 1 && !close ? `First scan ${start}` : ''}</text>`);
  // now marker (pin)
  const nx = X(v.s.overall);
  out.push(`<path d="M${nx},${y - 6} m-11,-14 a11,11 0 1,1 22,0 c0,8 -11,20 -11,20 c0,0 -11,-12 -11,-20z" fill="#000050"/>
    <circle cx="${nx}" cy="${y - 20}" r="4" fill="#fff"/>
    <text x="${nx}" y="${y - 32}" text-anchor="middle" font-size="16" font-weight="800" fill="#000050">${v.s.overall}</text>
    ${v.history.length > 1 ? `<text x="${nx}" y="${y + 36}" text-anchor="${close ? 'start' : 'middle'}" font-size="12" font-weight="700" fill="#000050">Now${close ? ` <tspan font-weight="400" fill="#6A6F76">(first scan ${start})</tspan>` : ''}</text>` : ''}`);
  // end
  out.push(`<circle cx="${X(100)}" cy="${y}" r="6" fill="#fff" stroke="#000050" stroke-width="2"/>
    <text x="${X(100)}" y="${y + 36}" text-anchor="end" font-size="12" font-weight="700" fill="#000050">100</text>`);
  // gap label (unmeasured)
  const gap = v.missing - v.total;
  if (gap > 0) { const gx = (X(pos) + X(100)) / 2; out.push(`<text x="${gx}" y="${y - 20}" text-anchor="middle" font-size="11" fill="#6A6F76">${gap} not measurable yet</text>`); }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route from your first score to 100">${out.join('')}</svg>`;
}

/* ------------------------------------------------------------------ switcher + stubs */
const VARIANTS = [
  { key: 'd', name: 'Lead with the action', render: variantD },
  { key: 'e', name: 'Route to 100', render: variantE },
  { key: 'f', name: 'One focus card', render: variantF }
];
const params = () => new URLSearchParams(location.search);
function currentVariant() { const k = params().get('variant'); return Math.max(0, VARIANTS.findIndex(x => x.key === k)); }
function currentScan() { const n = parseInt(params().get('scan') || '1', 10); return Math.min(SCANS.length, Math.max(1, isNaN(n) ? 1 : n)); }
function render() {
  const vi = currentVariant(), vd = VARIANTS[vi], si = currentScan();
  const v = view(si - 1);
  document.body.dataset.variant = vd.key;
  document.getElementById('root').innerHTML = vd.render(v);
  document.getElementById('proto-label').innerHTML = `<b>Prototype</b>${vd.key.toUpperCase()}: ${vd.name}`;
  document.querySelectorAll('[data-scan]').forEach(b => b.classList.toggle('on', +b.dataset.scan === si));
  document.title = `PROTOTYPE ${vd.key.toUpperCase()} scan ${si}${SCANS[si - 1].illustrative ? ' (illustrative)' : ''}: ${vd.name}`;
}
function setParams(o) { const u = new URL(location.href); Object.entries(o).forEach(([k, val]) => u.searchParams.set(k, val)); history.replaceState(null, '', u); render(); window.scrollTo(0, 0); }
function cycle(dir) { setParams({ variant: VARIANTS[(currentVariant() + dir + VARIANTS.length) % VARIANTS.length].key }); }
document.querySelectorAll('[data-cycle]').forEach(b => b.addEventListener('click', () => cycle(+b.dataset.cycle)));
document.querySelectorAll('[data-scan]').forEach(b => b.addEventListener('click', () => setParams({ scan: b.dataset.scan })));
document.addEventListener('keydown', e => {
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.key === '1' || e.key === '2' || e.key === '3') setParams({ scan: e.key });
  if (e.key === 'Escape') closeDrawer();
});
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function openBrief(slug) {
  const v = view(currentScan() - 1), t = v.themes.find(x => x.slug === slug);
  drawer.innerHTML = `
    <button type="button" class="btn" data-close="1" style="float:right">Close</button>
    <h3>${esc(t.name)}</h3>
    <p class="meta">Worth about ${pts(t.worth)}. ${esc(t.effort)}. ${t.pass} of ${t.k} checks already pass.</p>
    <p>${esc(t.description)}</p>
    <p style="margin-top:16px"><button type="button" class="btn" data-copy="briefs">Copy all ${t.checks} ${t.checks === 1 ? 'brief' : 'briefs'}</button></p>
    <div class="stub">Prototype stub. Below this header the Theme brief holds the per-check fix briefs exactly as the current report renders them (${t.checks} ${t.checks === 1 ? 'section' : 'sections'} here). Nothing in it changes with the Layer 1 restyle.</div>`;
  drawer.classList.add('open'); scrim.classList.add('open');
}
function closeDrawer() { drawer.classList.remove('open'); scrim.classList.remove('open'); }
scrim.addEventListener('click', closeDrawer);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-brief]'); if (b) { openBrief(b.dataset.brief); return; }
  if (e.target.closest('[data-close]')) { closeDrawer(); return; }
  const c = e.target.closest('[data-copy]');
  if (c) { const txt = c.dataset.copy === 'rerun' ? rerun(view(currentScan() - 1)) : '(briefs)'; navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); const o = c.textContent; c.textContent = 'Copied'; setTimeout(() => c.textContent = o, 1200); return; }
  const l = e.target.closest('[data-l2link]');
  if (l) { const d = document.getElementById('layer2'); if (d) d.open = true; }
});
render();
</script>
</body></html>
